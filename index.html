<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>UNISHA – ACCA Learning Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--navy:#10204a;--bg:#f3f4f9;--card:#fff;--ink:#14213d;--mute:#5d6785;--lav:#e8e3fa;--line:#dfe2ee;--g:#1c8a5a;--r:#c03a3a;--o:#c9751a;--b:#2f5fd0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1226;--card:#141d38;--ink:#e8ebf7;--mute:#9aa4c4;--lav:#2a2653;--line:#27325a;--g:#4cc38a;--r:#ff7b7b;--o:#f0a24f;--b:#7fa2ff}}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.55 Georgia,"Times New Roman",serif}
h1,h2,h3,button,nav,.ui{font-family:"Segoe UI",system-ui,sans-serif}h1{font-size:30px;margin:0 0 6px}h2{font-size:21px;margin:22px 0 10px}h3{font-size:16px;margin:0 0 6px}
#app{display:flex;min-height:100%}aside{width:236px;background:var(--navy);color:#fff;padding:20px 12px;flex:none}aside .logo{font:700 20px "Segoe UI",sans-serif;padding:0 10px 14px}
aside button{display:block;width:100%;text-align:left;background:none;border:0;color:#cdd5f5;padding:9px 10px;border-radius:9px;font-size:14px;cursor:pointer}aside button.on{background:rgba(232,227,250,.16);color:#fff}aside button:disabled{opacity:.4;cursor:default}
main{flex:1;padding:26px;max-width:1100px;min-width:0}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 0}
.hero{background:linear-gradient(135deg,#10204a,#2a3f87);color:#fff;border-radius:18px;padding:26px}.hero p{max-width:60ch;margin:6px 0}
.demo{background:var(--lav);border-radius:10px;padding:9px 13px;font:13px "Segoe UI",sans-serif;margin:12px 0}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.big{font:700 26px "Segoe UI",sans-serif}.mute{color:var(--mute);font-size:13px}
.btn{background:var(--navy);color:#fff;border:0;border-radius:9px;padding:9px 15px;font-size:14px;cursor:pointer}.btn.alt{background:var(--lav);color:var(--ink)}.btn:disabled{opacity:.4;cursor:default}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:10px 13px;margin:7px 0;font-size:15px;cursor:pointer}.opt.sel{border-color:var(--b);background:var(--lav)}.opt.ok{border-color:var(--g)}.opt.bad{border-color:var(--r)}
.tag{display:inline-block;border-radius:20px;padding:1px 10px;font:12px "Segoe UI",sans-serif;background:var(--lav)}.g{color:var(--g)}.r{color:var(--r)}.o{color:var(--o)}.b{color:var(--b)}
.nav{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.nav button{padding:8px 0;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer}.nav .a{background:var(--b);color:#fff}.nav .f{outline:2px solid var(--o)}.nav .c{border-color:var(--navy);border-width:2.5px}
.ex{display:grid;grid-template-columns:1fr 250px;gap:14px}table{width:100%;border-collapse:collapse;font:14px "Segoe UI",sans-serif}td,th{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
.stars{font-size:30px;color:var(--o)}.bar{height:9px;border-radius:5px;background:var(--line)}.bar i{display:block;height:100%;border-radius:5px;background:var(--b)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}pre{white-space:pre-wrap;font:inherit;margin:4px 0}
@media(max-width:800px){#app{display:block}aside{width:auto;display:flex;overflow-x:auto;padding:8px;gap:2px}aside .logo{display:none}aside button{white-space:nowrap;width:auto}main{padding:14px}.ex{grid-template-columns:1fr}}

/* Animated welcome intro */
#welcomeIntro{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 50% 42%,#263f82 0%,#142858 42%,#08132f 100%);
  color:#fff;font-family:"Segoe UI",system-ui,sans-serif;opacity:1;visibility:visible;
  transition:opacity .75s ease,visibility .75s ease}
#welcomeIntro.hide{opacity:0;visibility:hidden;pointer-events:none}
#welcomeIntro .intro-glow{position:absolute;width:min(72vw,620px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(133,158,255,.24),rgba(133,158,255,0) 68%);
  animation:introPulse 2.8s ease-in-out infinite}
#welcomeIntro .intro-content{position:relative;text-align:center;padding:28px;animation:introRise .9s cubic-bezier(.2,.8,.2,1) both}
#welcomeIntro .intro-kicker{font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:#c7d4ff;margin-bottom:20px}
#welcomeIntro .intro-title{font-size:clamp(34px,8vw,76px);font-weight:800;letter-spacing:.035em;line-height:1.05;
  text-shadow:0 8px 35px rgba(0,0,0,.25);margin:0}
#welcomeIntro .intro-title span{display:block;color:#b9caff;margin-top:10px}
#welcomeIntro .intro-sub{font-size:clamp(14px,2vw,18px);color:#dbe4ff;letter-spacing:.08em;margin:22px 0 0}
#welcomeIntro .intro-line{height:2px;width:0;max-width:230px;margin:28px auto 0;
  background:linear-gradient(90deg,transparent,#dce6ff,transparent);animation:introLine 1.1s .55s ease forwards}
#welcomeIntro .intro-skip{position:absolute;right:22px;bottom:22px;border:1px solid rgba(255,255,255,.35);
  border-radius:30px;padding:9px 16px;background:rgba(255,255,255,.08);color:#fff;cursor:pointer;font:13px "Segoe UI",sans-serif}
#welcomeIntro .intro-skip:hover{background:rgba(255,255,255,.18)}
@keyframes introRise{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes introPulse{0%,100%{transform:scale(.9);opacity:.65}50%{transform:scale(1.08);opacity:1}}
@keyframes introLine{to{width:230px}}
@media(prefers-reduced-motion:reduce){#welcomeIntro *,#welcomeIntro *:before{animation:none!important;transition:none!important}}

</style></head><body>
<div id="welcomeIntro" role="dialog" aria-label="Welcome to the ACCA mock test">
  <div class="intro-glow" aria-hidden="true"></div>
  <div class="intro-content">
    <div class="intro-kicker">Your learning journey starts here</div>
    <h1 class="intro-title">WELCOME <span>UNISHA</span></h1>
    <p class="intro-sub">TO YOUR ACCA MOCK TEST</p>
    <div class="intro-line" aria-hidden="true"></div>
  </div>
  <button class="intro-skip" type="button" onclick="closeWelcomeIntro()">Skip intro</button>
</div>
<div id="app"><aside id="side"></aside><main id="main"></main></div>
<script>
const QS=[
{id:"FA-001",t:"Inventory",ch:"FA – Inventory (IAS 2)",d:1,ty:"mcq",cat:"Calculation",q:"Opening inventory is 100 units at $10. 200 units are then purchased at $12 and 150 units are sold. Using FIFO, what is the closing inventory value?",o:["$1,500","$1,700","$1,800","$1,650"],a:2,why:{0:"$1,500 values 150 units at the oldest price ($10). Those are the units sold under FIFO, not the units left.",1:"$1,700 is the weighted-average answer (3,400 ÷ 300 = $11.33 × 150), not FIFO.",3:"$1,650 does not come from either method. Work out which cost layers remain."},how:"FIFO issues the oldest stock first: 100 units at $10 and 50 units at $12 are sold. The remaining 150 units all come from the $12 purchase: 150 × $12 = $1,800.",rule:"IAS 2 allows FIFO or weighted average cost; LIFO is not permitted."},
{id:"FA-002",t:"Depreciation",ch:"FA – Non-current assets",d:0,ty:"mcq",cat:"Calculation",q:"A machine costs $50,000, has a residual value of $5,000 and a useful life of 5 years. What is the annual straight-line depreciation?",o:["$10,000","$9,000","$11,000","$4,500"],a:1,why:{0:"$10,000 ignores the residual value. Depreciable amount = cost minus residual value.",2:"$11,000 adds the residual value instead of deducting it.",3:"$4,500 divides the depreciable amount by 10 instead of the 5-year life."},how:"(50,000 − 5,000) ÷ 5 = $9,000 per year.",rule:"Straight-line charge = (cost − residual value) ÷ useful life."},
{id:"FA-003",t:"Depreciation",ch:"FA – Non-current assets",d:1,ty:"mcq",cat:"Calculation",q:"An asset costing $40,000 is depreciated at 20% on the reducing-balance method. What is the charge for year 2?",o:["$8,000","$6,400","$7,200","$6,000"],a:1,why:{0:"$8,000 is the year 1 charge (20% × $40,000). Year 2 uses the reduced balance.",2:"$7,200 is not 20% of the year 1 closing net book value ($32,000).",3:"$6,000 is not 20% of the year 1 closing net book value ($32,000)."},how:"Year 1: 20% × 40,000 = 8,000, so NBV = 32,000. Year 2: 20% × 32,000 = $6,400.",rule:"Reducing-balance depreciation is a percentage of the opening net book value."},
{id:"FA-004",t:"Bank reconciliation",ch:"FA – Bank reconciliation",d:2,ty:"mcq",cat:"Calculation",q:"The cash book shows a debit balance of $2,400. Bank charges of $40 are not yet in the cash book. Unpresented cheques total $300 and uncredited lodgements total $500. What is the balance on the bank statement?",o:["$2,160","$2,560","$2,360","$2,600"],a:0,why:{1:"$2,560 reverses the timing differences (it adds lodgements and deducts cheques).",2:"$2,360 is only the adjusted cash book balance. The timing differences still need applying.",3:"$2,600 ignores the bank charges and reverses the timing differences."},how:"Adjusted cash book = 2,400 − 40 = 2,360. Bank statement = 2,360 − 500 (lodgements the bank has not yet credited) + 300 (cheques the bank has not yet paid) = $2,160. Check: 2,160 + 500 − 300 = 2,360.",rule:"Update the cash book for items the bank knows about; then reconcile for timing differences."},
{id:"FA-005",t:"Financial statements",ch:"FA – Statement of financial position",d:0,ty:"multi",cat:"Conceptual",q:"Which TWO of these are current assets? (Select two)",o:["Trade receivables","Inventory held for sale","Delivery vehicle used in the business","Bank loan repayable in 5 years"],a:[0,1],why:{2:"A delivery vehicle is a non-current asset because it is used for more than one period.",3:"A loan repayable in 5 years is a non-current liability, not an asset."},how:"Current assets are expected to be turned into cash within the operating cycle or one year: trade receivables and inventory.",rule:"Classification of assets and liabilities as current or non-current."},
{id:"FA-006",t:"Ratio analysis",ch:"FA – Interpretation of accounts",d:0,ty:"num",cat:"Calculation",q:"Sales are $80,000 and cost of sales is $52,000. Calculate the gross profit margin as a percentage (enter the number only).",a:35,how:"Gross profit = 80,000 − 52,000 = 28,000. Margin = 28,000 ÷ 80,000 × 100 = 35%.",rule:"Gross profit margin = gross profit ÷ sales × 100."},
{id:"FA-007",t:"Capital and profit",ch:"FA – Incomplete records",d:2,ty:"mcq",cat:"Calculation",q:"Opening capital is $20,000 and closing capital is $30,000. Drawings were $4,000 and additional capital of $2,000 was introduced. What was the profit for the year?",o:["$8,000","$10,000","$12,000","$16,000"],a:2,why:{0:"$8,000 deducts drawings and adds capital introduced, which is the wrong direction for both.",1:"$10,000 is just the change in capital. Drawings and capital introduced must be adjusted.",3:"$16,000 adds capital introduced instead of removing it."},how:"Closing − opening capital = 10,000 = profit − drawings + capital introduced. So profit = 10,000 + 4,000 − 2,000 = $12,000.",rule:"Closing capital = opening capital + capital introduced + profit − drawings."},
{id:"FA-008",t:"Receivables",ch:"FA – Irrecoverable debts and allowances",d:1,ty:"mcq",cat:"Calculation",q:"Trade receivables are $50,000 before writing off an irrecoverable debt of $2,000. An allowance of 5% is required on the remaining receivables. What allowance is required?",o:["$2,500","$2,400","$2,600","$2,000"],a:1,why:{0:"$2,500 applies 5% before deducting the irrecoverable debt.",2:"$2,600 applies 5% to $52,000, adding the debt instead of deducting it.",3:"$2,000 is the debt written off, not the allowance."},how:"Write off first: 50,000 − 2,000 = 48,000. Allowance = 5% × 48,000 = $2,400.",rule:"Write off irrecoverable debts first; the allowance applies to the remaining receivables."},
{id:"FA-009",t:"Accruals and prepayments",ch:"FA – Accruals and prepayments",d:1,ty:"mcq",cat:"Calculation",q:"The year end is 31 December. Insurance of $6,000 was paid on 1 October for 12 months. What is the prepayment at the year end?",o:["$1,500","$4,500","$6,000","$3,000"],a:1,why:{0:"$1,500 is the expense for October to December, not the prepayment.",2:"$6,000 treats the entire payment as prepaid.",3:"$3,000 assumes only 6 months remain."},how:"9 of the 12 months fall after the year end: 6,000 × 9 ÷ 12 = $4,500.",rule:"A prepayment is the part of a payment relating to a future period."},
{id:"FA-010",t:"Accounting concepts",ch:"FA – Conceptual framework",d:0,ty:"mcq",cat:"Conceptual",q:"Insurance expense is recognised in the period it relates to, regardless of when cash is paid. Which concept is applied?",o:["Accruals","Cash basis","Materiality","Business entity"],a:0,why:{1:"The cash basis recognises items when cash moves, which is the opposite of this treatment.",2:"Materiality concerns whether an omission or error would influence users.",3:"Business entity keeps the owner’s affairs separate from the business."},how:"Accruals (matching) records income and expenses when they are earned or incurred, not when cash changes hands.",rule:"Accruals basis of accounting."},
{id:"FA-011",t:"Trial balance and errors",ch:"FA – Trial balance and error correction",d:2,ty:"mcq",cat:"Conceptual",q:"Which error would NOT be revealed by extracting a trial balance?",o:["A debit entry with no corresponding credit","A ledger account that was added up incorrectly","A non-current asset purchase debited to the purchases account","A figure entered on one side of an entry only"],a:2,why:{0:"A one-sided entry leaves debits and credits unequal, so the trial balance would not agree.",1:"A casting error changes one balance only, so the totals would differ.",3:"A single-sided entry also leaves debits and credits unequal."},how:"An error of principle posts both sides, but to the wrong class of account (purchases instead of non-current assets). Debits still equal credits, so the trial balance agrees.",rule:"Errors that do not affect the trial balance: omission, commission, principle, compensating, reversal and original entry."},
{id:"FA-012",t:"Ratio analysis",ch:"FA – Interpretation of accounts",d:1,ty:"num",cat:"Calculation",q:"Current assets are $60,000 and current liabilities are $40,000. Calculate the current ratio (enter the number only).",a:1.5,how:"Current ratio = 60,000 ÷ 40,000 = 1.5.",rule:"Current ratio = current assets ÷ current liabilities."}];
const TR={"Inventory":"Revisit FIFO and weighted-average costing; redo closing-inventory examples layer by layer.","Depreciation":"Revise straight-line and reducing-balance; practise year-by-year net book value tables.","Bank reconciliation":"Adjust the cash book first, then reconcile to the bank statement.","Financial statements":"Review current versus non-current classification of assets and liabilities.","Ratio analysis":"Learn the margin and liquidity formulas, then apply them to full statements.","Capital and profit":"Practise the capital-comparison method of finding profit.","Receivables":"Practise irrecoverable debts versus allowances, and the order of calculation.","Accruals and prepayments":"Draw a timeline for each payment to split expense from prepayment or accrual.","Accounting concepts":"Re-read definitions of accruals, going concern, materiality and business entity with one example each.","Trial balance and errors":"Classify each error type and decide whether the trial balance would still agree."};
const LV=["Foundation","Intermediate","Advanced","Exam Standard","Expert Challenge"],DF=["Easy","Moderate","Difficult"],MK=2,ALLOW=24*60;
const TRACKS={A:{n:"Current Applied Knowledge (2026/27)",s:["BT – Business and Technology","MA – Management Accounting","FA – Financial Accounting"]},B:{n:"Redesigned Knowledge Level (from July 2027)",s:["K1 – Financial Accounting","K2 – Management Accounting","K3 – Business Law","Responsible Business Management (essential employability module)"]}};
let S={v:"dash",track:"A",sure:0,rt:null,rep:null},DB={attempts:[],mistakes:{}},ex=null,tick=null;
try{const r=localStorage.getItem("unisha_v1");if(r)DB=JSON.parse(r)}catch(e){}
try{const r=localStorage.getItem("unisha_draft");if(r){const d=JSON.parse(r);if(d.end>Date.now())ex=d}}catch(e){}
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"),Q=id=>QS.find(q=>q.id===id);
const save=()=>{try{localStorage.setItem("unisha_v1",JSON.stringify(DB))}catch(e){}};
const draft=()=>{try{ex?localStorage.setItem("unisha_draft",JSON.stringify(ex)):localStorage.removeItem("unisha_draft")}catch(e){}};
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const has=a=>a!==undefined&&a!==""&&!(Array.isArray(a)&&!a.length);
const okQ=(q,a)=>!has(a)?false:q.ty==="mcq"?a===q.a:q.ty==="multi"?[...a].sort().join()===q.a.join():Math.abs(parseFloat(a)-q.a)<1e-6;
const fmt=(q,a)=>!has(a)?"Not answered":q.ty==="mcq"?q.o[a]:q.ty==="multi"?a.map(i=>q.o[i]).join("; "):a;
const pct=(n,d)=>d?Math.round(n/d*100):null;
function stars(p){const s=p>=90?5:p>=80?4.5:p>=70?4:p>=60?3.5:p>=50?3:p>=40?2:p>=30?1.5:1;return{s,t:"★".repeat(Math.floor(s))+(s%1?"½":""),l:{5:"Outstanding",4.5:"Excellent",4:"Very Good",3.5:"Good",3:"Developing",2:"Needs Improvement",1.5:"Weak",1:"Requires Intensive Revision"}[s]}}
const cls=a=>a>=80?["Strong","g"]:a>=60?["Average","b"]:a>=40?["Weak","o"]:["Critical","r"];
function go(v){S.v=v;S.sure=0;render()}
function render(){
 const N=[["dash","Dashboard"],["syl","Syllabus"],["mocks","100 Mock Tests"],["mist","My Mistakes"],["rep","Performance Analysis"]],X=["My Courses","Question Bank","Study Guides","Formula Sheets","AI Study Tutor","My Profile"];
 $("#side").innerHTML='<div class="logo">UNISHA</div>'+N.map(n=>`<button class="${S.v===n[0]||(S.v==="exam"&&n[0]==="mocks")?"on":""}" onclick="go('${n[0]}')">${n[1]}</button>`).join("")+X.map(x=>`<button disabled title="Needs backend and authored content">${x}</button>`).join("");
 clearInterval(tick);
 $("#main").innerHTML=({dash:vDash,syl:vSyl,mocks:vMocks,exam:vExam,mist:vMist,rep:vRep})[S.v]();
 if(S.v==="exam"&&ex&&!S.sure){tick=setInterval(()=>{ex.t[ex.i]=(ex.t[ex.i]||0)+1;const r=(ex.end-Date.now())/1000;if($("#tm"))$("#tm").textContent=mmss(r);if(r<=0)submitEx()},1000)}
}
const demo='<div class="demo"><b>Demo mode.</b> No backend is connected, so results are saved only in this browser. Included: 12 original sample FA questions (not official ACCA questions) in one playable mock. The other 99 mocks are catalogue placeholders until questions are authored and verified.</div>';
function stats(){const A=DB.attempts,T={};let n=0,ok=0;A.forEach(a=>a.items.forEach(x=>{const q=Q(x.qid);n++;if(x.ok)ok++;const t=T[q.t]=T[q.t]||{n:0,ok:0};t.n++;if(x.ok)t.ok++}));
 const tp=Object.entries(T).map(([k,v])=>({k,acc:pct(v.ok,v.n)})).sort((a,b)=>a.acc-b.acc);const ps=A.map(a=>a.pct);
 return{A,n,ok,tp,avg:ps.length?Math.round(ps.reduce((x,y)=>x+y,0)/ps.length):0,hi:ps.length?Math.max(...ps):0,lo:ps.length?Math.min(...ps):0,st:A.length?(A.reduce((x,a)=>x+stars(a.pct).s,0)/A.length).toFixed(1):"–"}}
function vDash(){const s=stats(),last=s.A.slice(-8);
 const chart=last.length?`<svg viewBox="0 0 320 120" width="100%" role="img" aria-label="Mock score history">${last.map((a,i)=>{const h=a.pct*1,x=10+i*38;return `<rect x="${x}" y="${110-h}" width="28" height="${h}" rx="4" fill="var(--b)"/><text x="${x+14}" y="${106-h}" text-anchor="middle" font-size="10" fill="var(--ink)">${a.pct}</text>`}).join("")}</svg>`:'<p class="mute">No attempts yet. Complete a mock test to see your score history.</p>';
 return `<div class="hero"><h1>WELCOME UNISHA!</h1><p>Welcome to Your ACCA Knowledge Level Learning &amp; Mock Test Portal.</p><p>Your journey towards becoming an ACCA professional starts here. Learn every concept, practise thousands of questions, challenge yourself through realistic examinations and discover exactly where you need to improve.</p><p><b>Learn. Practise. Analyse. Improve. Succeed.</b></p><p class="row"><button class="btn alt" onclick="go('mocks')">Open mock tests</button></p></div>${demo}
 <div class="grid"><div class="card"><div class="big">${s.A.length}</div><span class="mute">Mocks completed</span></div><div class="card"><div class="big">${s.avg}%</div><span class="mute">Average score</span></div><div class="card"><div class="big">${s.hi}% / ${s.lo}%</div><span class="mute">Highest / lowest</span></div><div class="card"><div class="big">${s.n}</div><span class="mute">Questions attempted</span></div><div class="card"><div class="big">${pct(s.ok,s.n)??0}%</div><span class="mute">Overall accuracy</span></div><div class="card"><div class="big">${s.st}</div><span class="mute">Average star rating</span></div></div>
 <h2>Score history</h2><div class="card">${chart}</div>
 <div class="grid" style="grid-template-columns:1fr 1fr"><div class="card"><h3>Weakest topics</h3>${s.tp.slice(0,3).map(t=>`<div>${t.k} <b class="${cls(t.acc)[1]}">${t.acc}%</b></div>`).join("")||'<span class="mute">Appears after your first mock.</span>'}</div><div class="card"><h3>Strongest topics</h3>${s.tp.slice(-3).reverse().map(t=>`<div>${t.k} <b class="${cls(t.acc)[1]}">${t.acc}%</b></div>`).join("")||'<span class="mute">Appears after your first mock.</span>'}</div></div>
 <h2>Recent attempts</h2>${s.A.slice().reverse().slice(0,5).map(a=>{const i=DB.attempts.indexOf(a);return `<div class="card row ui"><b>${esc(a.name)}</b><span class="mute">${new Date(a.date).toLocaleDateString()}</span><span>${a.pct}% ${stars(a.pct).t}</span><button class="btn alt" onclick="openRep(${i})">View report</button></div>`}).join("")||'<p class="mute">Nothing yet.</p>'}
 <p><button class="btn alt" onclick="if(confirm('Delete all demo data in this browser?')){DB={attempts:[],mistakes:{}};save();ex=null;draft();render()}">Reset demo data</button></p>`}
function vSyl(){return `<h1>Syllabus</h1><p>Select the track that applies to Unisha’s exam. Questions from the two tracks are never mixed.</p>${Object.entries(TRACKS).map(([k,t])=>`<div class="card"><h3>Track ${k}: ${t.n} ${S.track===k?'<span class="tag">Selected</span>':""}</h3><ul>${t.s.map(x=>`<li>${x}</li>`).join("")}</ul><button class="btn ${S.track===k?"":"alt"}" onclick="S.track='${k}';render()">Use Track ${k}</button></div>`).join("")}<div class="demo">Subject lists come from your brief. The demo does not fetch live ACCA documents, so check the study guide and examinable documents at accaglobal.com before relying on them.</div>`}
function vMocks(){const A=TRACKS[S.track].s.slice(0,3).map(x=>x.split(" – ")[0]);let h=`<h1>100 Mock Tests</h1>${demo}<p class="mute">Showing Track ${S.track}. Full-length practice default is 50 questions, 100 marks; the demo mock is scaled to 12 questions, ${12*MK} marks, ${ALLOW/60} minutes.</p>`;
 for(let l=0;l<5;l++){h+=`<h2>Level ${l+1} – ${LV[l]}</h2><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(170px,1fr))">`;for(let n=l*20+1;n<=l*20+20;n++){const sub=A[(n-1)%3],play=n===1&&S.track==="A",best=DB.attempts.filter(a=>a.mock===n&&a.track===S.track).map(a=>a.pct),dr=play&&ex;
 h+=`<div class="card ui" style="margin:0;opacity:${play?1:.6}"><b>Mock ${String(n).padStart(2,"0")}</b> <span class="tag">${sub}</span><div class="mute">${LV[l]} · ${play?"12 Q":"50 Q"}</div><div class="mute">${best.length?"Best: "+Math.max(...best)+"%":"Not attempted"}</div>${play?`<button class="btn" onclick="startEx()">${dr?"Resume":"Start"}</button>`:'<button class="btn" disabled>Questions pending</button>'}</div>`}h+="</div>"}return h}
function startEx(){if(!ex){ex={track:"A",mock:1,ids:QS.map(q=>q.id),a:{},f:{},t:{},i:0,end:Date.now()+ALLOW*1000,t0:Date.now()};draft()}S.v="exam";S.sure=0;render()}
function apply(q,cur,v){return q.ty==="mcq"?v:q.ty==="multi"?((cur||[]).includes(v)?cur.filter(x=>x!==v):[...(cur||[]),v].sort()):v}
function qIn(q,cur,set){return q.ty==="num"?`<input type="number" step="any" value="${cur??""}" oninput="${set}(this.value,1)" style="font-size:16px;padding:9px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)">`:q.o.map((o,i)=>`<button class="opt ${(q.ty==="mcq"?cur===i:(cur||[]).includes(i))?"sel":""}" onclick="${set}(${i})">${"ABCD"[i]}. ${esc(o)}</button>`).join("")}
function exSet(v,nr){const q=Q(ex.ids[ex.i]);ex.a[ex.i]=apply(q,ex.a[ex.i],v);draft();nr?navUpd():render()}
function navUpd(){$("#nv").innerHTML=navH()}
function navH(){return ex.ids.map((_,i)=>`<button class="${has(ex.a[i])?"a":""} ${ex.f[i]?"f":""} ${i===ex.i?"c":""}" onclick="ex.i=${i};draft();render()">${i+1}</button>`).join("")}
function vExam(){if(!ex)return vMocks();const n=ex.ids.length,ans=ex.ids.filter((_,i)=>has(ex.a[i])).length;
 if(S.sure)return `<h1>Submit examination?</h1><div class="card"><p>Answered: <b>${ans}</b> of ${n}. Unanswered: <b>${n-ans}</b>. Marked for review: <b>${Object.values(ex.f).filter(Boolean).length}</b>.</p><p>You cannot change answers after submitting.</p><div class="row"><button class="btn alt" onclick="S.sure=0;render()">Return to exam</button><button class="btn" onclick="submitEx()">Submit now</button></div></div>`;
 const q=Q(ex.ids[ex.i]);
 return `<div class="row ui" style="justify-content:space-between"><h1 style="font-size:20px">Mock 01 · FA · Foundation</h1><div class="card" style="margin:0;padding:8px 14px"><b>Time left <span id="tm">${mmss((ex.end-Date.now())/1000)}</span></b></div></div>
 <div class="bar"><i style="width:${ans/n*100}%"></i></div><p class="mute ui">Progress: ${ans}/${n} answered</p>
 <div class="ex"><div class="card"><div class="mute ui">Question ${ex.i+1} of ${n} · ${MK} marks${q.ty==="multi"?" · select all that apply":""}</div><p>${esc(q.q)}</p>${qIn(q,ex.a[ex.i],"exSet")}
 <div class="row" style="margin-top:12px"><button class="btn alt" ${ex.i?"":"disabled"} onclick="ex.i--;render()">Previous</button><button class="btn alt" ${ex.i<n-1?"":"disabled"} onclick="ex.i++;render()">Next</button><button class="btn alt" onclick="ex.f[ex.i]=!ex.f[ex.i];draft();render()">${ex.f[ex.i]?"Unmark review":"Mark for review"}</button><button class="btn alt" onclick="delete ex.a[ex.i];draft();render()">Clear answer</button></div></div>
 <div class="card"><b class="ui">Questions</b><div class="nav" id="nv" style="margin:8px 0">${navH()}</div><p class="mute ui">Blue answered · orange outline marked · bold border current</p><button class="btn" onclick="S.sure=1;render()">Submit examination</button></div></div>`}
function submitEx(){if(!ex)return;const items=ex.ids.map((id,i)=>{const q=Q(id);return{qid:id,a:ex.a[i]??null,ok:okQ(q,ex.a[i]),t:ex.t[i]||0,f:!!ex.f[i]}});
 const marks=items.filter(x=>x.ok).length*MK,total=items.length*MK,taken=Math.min(ALLOW,Math.round((Date.now()-ex.t0)/1000));
 const at={name:"Mock 01 – FA Foundation (demo)",mock:ex.mock,track:ex.track,date:Date.now(),items,marks,total,pct:Math.round(marks/total*100),taken,allowed:ALLOW};
 items.forEach(x=>{const m=DB.mistakes[x.qid];if(!x.ok){const q=Q(x.qid),o=DB.mistakes[x.qid]=m||{wrong:0,streak:0,understood:false,last:""};o.wrong++;o.streak=0;o.understood=false;o.last=fmt(q,x.a)}else if(m)m.streak++});
 DB.attempts.push(at);save();ex=null;draft();S.rep=DB.attempts.length-1;S.v="rep";render()}
function openRep(i){S.rep=i;go("rep")}
function vRep(){const a=DB.attempts[S.rep??DB.attempts.length-1];if(!a)return '<h1>Performance Analysis</h1><div class="card">Complete a mock test to get your full report: topic analysis, wrong-answer teaching, time analysis and an improvement plan.</div>';
 const it=a.items.map(x=>({...x,q:Q(x.qid)})),T={},D=[0,1,2].map(()=>({n:0,ok:0})),C={};
 it.forEach(x=>{const t=T[x.q.t]=T[x.q.t]||{n:0,at:0,ok:0,mm:0};t.n++;if(has(x.a))t.at++;if(x.ok)t.ok++;else t.mm+=MK;D[x.q.d].n++;if(x.ok)D[x.q.d].ok++;const c=C[x.q.cat]=C[x.q.cat]||{n:0,ok:0};c.n++;if(x.ok)c.ok++});
 const tp=Object.entries(T).map(([k,v])=>({k,...v,acc:Math.round(v.ok/v.n*100)})).sort((x,y)=>x.acc-y.acc||y.mm-x.mm),st=stars(a.pct),right=it.filter(x=>x.ok).length,un=it.filter(x=>!has(x.a)).length,wrong=it.length-right-un,per=a.allowed/it.length;
 const slow=it.filter(x=>x.t>per*1.5),tc=it.filter(x=>x.ok),tw=it.filter(x=>!x.ok&&has(x.a)),av=l=>l.length?Math.round(l.reduce((s,x)=>s+x.t,0)/l.length):0;
 const dp=D.map(d=>pct(d.ok,d.n)),cc=Object.entries(C).map(([k,v])=>k+" "+pct(v.ok,v.n)+"%").join(", ");
 const strong=tp.filter(x=>x.acc>=80).map(x=>x.k),weak=tp.filter(x=>x.acc<60);
 let fb=`Unisha scored ${a.pct}% (${a.marks}/${a.total} marks), a ${a.pct>=50?"pass":"fail"} on the platform’s practice scale. `;
 fb+=strong.length?`She answered ${strong.slice(0,3).join(", ")} well. `:"No topic was answered fully correctly. ";
 fb+=weak.length?`Performance in ${weak.slice(0,3).map(x=>x.k.toLowerCase()).join(", ")} needs improvement. `:"No topic fell below the average band. ";
 if(dp[0]!==null&&dp[2]!==null&&dp[2]<dp[0])fb+=`Accuracy fell from ${dp[0]}% on easy questions to ${dp[2]}% on difficult ones. `;
 fb+=`By question type: ${cc}. `;
 fb+=un?`${un} question${un>1?"s were":" was"} left unanswered. `:"";
 fb+=slow.length?`She spent more than 1.5× the average allowance on ${slow.length} question${slow.length>1?"s":""} (${slow.map(x=>x.qid).join(", ")}). `:`Question timing was within the allowance. `;
 fb+=`She finished with ${mmss(a.allowed-a.taken)} left.`;
 const plan=tp.filter(x=>x.acc<100).slice(0,3);
 const nxt=a.pct>=70?"Mock 02 (planned, questions not yet authored in this demo). Re-attempt My Mistakes first.":"Re-attempt every question in My Mistakes, then retake this mock after two days.";
 return `<h1>Examination report</h1><p class="mute">${esc(a.name)} · ${new Date(a.date).toLocaleString()} · platform rating, not an official ACCA grade</p>
 <div class="card"><div class="stars" aria-label="${st.t}">${st.t}</div><div class="big">${a.pct}% · ${st.l}</div><p class="ui">${a.marks} of ${a.total} marks · <span class="g">${right} correct</span> · <span class="r">${wrong} incorrect</span> · ${un} unanswered · time ${mmss(a.taken)} of ${mmss(a.allowed)} · average ${mmss(a.taken/it.length)} per question · ${a.pct>=50?"Practice pass":"Practice fail"} (50% threshold)</p></div>
 <h2>Topic-wise analysis</h2><div class="card" style="overflow-x:auto"><table><tr><th>Topic</th><th>Attempted</th><th>Correct</th><th>Incorrect</th><th>Accuracy</th><th>Marks</th><th>Rating</th></tr>${tp.map(t=>{const c=cls(t.acc);return `<tr><td>${t.k}</td><td>${t.at}/${t.n}</td><td>${t.ok}</td><td>${t.n-t.ok}</td><td>${t.acc}%</td><td>${t.ok*MK}/${t.n*MK}</td><td class="${c[1]}"><b>${c[0]}</b></td></tr>`}).join("")}</table><p class="mute">Strong ≥80%, Average 60–79%, Weak 40–59%, Critical below 40%. Topics here have only 1–2 questions each, so treat these as indicators.</p></div>
 <h2>Difficulty and time</h2><div class="card ui"><p>Easy: ${dp[0]??"–"}% · Moderate: ${dp[1]??"–"}% · Difficult: ${dp[2]??"–"}% · ${cc}</p><p>Average time on correct answers: ${av(tc)}s · on incorrect answers: ${av(tw)}s · skipped: ${un} · slow questions: ${slow.length?slow.map(x=>x.qid).join(", "):"none"} · time left: ${mmss(a.allowed-a.taken)}.${av(tw)>av(tc)*1.3?" You spent longer on questions you got wrong; if stuck, mark for review and move on.":""}</p></div>
 <h2>Examiner feedback</h2><div class="card"><p>${fb}</p></div>
 <h2>UNISHA’S NEXT IMPROVEMENT PLAN</h2><div class="card">${plan.length?plan.map((t,i)=>`<p><b>Priority ${i+1}: ${t.k}</b> (${t.acc}%)<br>${TR[t.k]}<br><span class="mute">Chapter: ${QS.find(q=>q.t===t.k).ch}</span></p>`).join(""):"<p>Every topic was answered correctly. Move on to a harder mock.</p>"}<p><b>Daily goal:</b> 20 minutes revising one priority topic, then re-attempt ${Math.max(3,wrong+un)} questions from My Mistakes. <b>Weekly goal:</b> clear all of My Mistakes with 3 correct attempts each, then sit the next mock.</p><p><b>Suggested next test:</b> ${nxt}</p></div>
 <h2>Wrong-answer analysis</h2>${it.filter(x=>!x.ok).map(x=>wrongH(x)).join("")||'<div class="card">No incorrect answers. Excellent work.</div>'}
 <p><button class="btn" onclick="go('mist')">Open My Mistakes</button></p>`}
function wrongH(x){const q=x.q,u=!has(x.a);let why;
 if(q.ty==="mcq")why=u?"You did not answer this question.":q.why[x.a];
 else if(q.ty==="multi"){const s=x.a||[],miss=q.a.filter(i=>!s.includes(i)).map(i=>q.o[i]),ext=s.filter(i=>!q.a.includes(i));why=(miss.length?"Missing correct option(s): "+miss.join("; ")+". ":"")+ext.map(i=>"Wrongly selected “"+q.o[i]+"”: "+q.why[i]).join(" ")}
 else why=u?"You did not answer this question.":"You entered "+x.a+" but the answer is "+q.a+". Recheck the formula and each step below.";
 return `<div class="card"><b>${q.id}</b> <span class="tag">${q.t}</span> <span class="tag">${DF[q.d]}</span><p>${esc(q.q)}</p>${q.o?q.o.map((o,i)=>{const c=q.ty==="mcq"?q.a===i:q.a.includes(i),s=q.ty==="mcq"?x.a===i:(x.a||[]).includes(i);return `<div class="opt ${c?"ok":s?"bad":""}" style="cursor:default">${"ABCD"[i]}. ${esc(o)} ${c?"✔ correct":""} ${s?"· your answer":""}</div>`}).join(""):""}
 <p class="ui"><b>Your answer:</b> ${esc(fmt(q,x.a))} · <b>Correct:</b> ${esc(q.ty==="num"?q.a:fmt(q,q.a))}</p><p><b>Why this is wrong:</b> ${esc(why)}</p><p><b>Working:</b> ${esc(q.how)}</p><p><b>Rule:</b> ${esc(q.rule)}</p><p class="mute">Revise: ${esc(q.ch)}</p></div>`}
function vMist(){const ids=Object.keys(DB.mistakes);let h=`<h1>My Mistakes</h1><p class="mute">Questions you answer wrongly are saved automatically. One correct answer does not clear a mistake: 3 correct in a row marks it as improved.</p>`;
 if(!ids.length)return h+'<div class="card">No mistakes saved yet. Complete a mock to build your revision list.</div>';
 const rec=ids.filter(i=>DB.mistakes[i].wrong>=2);if(rec.length)h+=`<div class="card"><b class="r">Recurring weaknesses:</b> ${[...new Set(rec.map(i=>Q(i).t))].join(", ")}</div>`;
 ids.forEach(id=>{const q=Q(id),m=DB.mistakes[id],r=S.rt&&S.rt.id===id?S.rt:null,tag=m.understood?'<span class="tag g">Understood</span>':m.streak>=3?'<span class="tag g">Improved</span>':m.wrong>=2?'<span class="tag r">Recurring</span>':'<span class="tag o">To revise</span>';
 h+=`<div class="card"><b>${id}</b> <span class="tag">${q.t}</span> ${tag} <span class="mute">wrong ${m.wrong}× · correct streak ${m.streak}</span><p>${esc(q.q)}</p>`;
 if(r&&!r.done)h+=qIn(q,r.a,"rtSet")+`<button class="btn" onclick="rtCheck()">Check answer</button>`;
 else{if(r&&r.done)h+=`<p class="${r.ok?"g":"r"}"><b>${r.ok?"Correct":"Incorrect"}.</b> Previous answer: ${esc(r.prev)}. New answer: ${esc(fmt(q,r.a))}.</p>`;
 h+=`<details><summary>Explanation</summary><p>${esc(q.how)}</p><p class="mute">${esc(q.rule)}</p></details><div class="row"><button class="btn alt" onclick="S.rt={id:'${id}',a:undefined};render()">Attempt again</button><button class="btn alt" onclick="DB.mistakes['${id}'].understood=true;save();render()">Mark understood</button></div>`}h+="</div>"});return h}
function rtSet(v,nr){const q=Q(S.rt.id);S.rt.a=apply(q,S.rt.a,v);if(!nr)render()}
function rtCheck(){const r=S.rt,q=Q(r.id),m=DB.mistakes[r.id];r.prev=m.last;r.ok=okQ(q,r.a);r.done=1;if(r.ok)m.streak++;else{m.wrong++;m.streak=0;m.understood=false}m.last=fmt(q,r.a);save();render()}

function closeWelcomeIntro(){
  const intro=document.getElementById("welcomeIntro");
  if(!intro)return;
  intro.classList.add("hide");
  window.setTimeout(()=>intro.remove(),800);
}
function initWelcomeIntro(){
  const intro=document.getElementById("welcomeIntro");
  if(!intro)return;
  window.setTimeout(closeWelcomeIntro,3600);
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeWelcomeIntro()},{once:true});
}

initWelcomeIntro();
render();
</script></body></html>
